<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Aromas & Encantos - Velas Aromáticas, Body Splash, Sabonetes Artesanais e Kits Personalizados.">

    <meta name="author" content="Aromas & Encantos">

    <title>{% block title %}Aromas & Encantos{% endblock %}</title>

    <link rel="icon"
        href="{{ url_for('static', filename='img/brand/lavanda.png') }}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    {% block css %}{% endblock %}

</head>

<body>

    {% block content %}
    {% endblock %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block scripts %}{% endblock %}

</body>

</html>
