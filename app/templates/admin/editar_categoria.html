{% extends "admin/layouts/_base.html" %}

{% block title %}Editar Categoria{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>Editar Categoria</h2>

            <p class="text-muted mb-0">
                Altere as informações da categoria.
            </p>

        </div>

        <a
            href="{{ url_for('admin.categorias') }}"
            class="btn btn-secondary">

            Voltar

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-4">

                    <label class="form-label">
                        Nome da Categoria
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        value="{{ categoria.nome }}"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        name="descricao"
                        rows="4"
                        class="form-control">{{ categoria.descricao }}</textarea>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Salvar Alterações

                    </button>

                    <a
                        href="{{ url_for('admin.categorias') }}"
                        class="btn btn-outline-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
