{% extends "admin/layouts/_base.html" %}

{% block title %}Nova Categoria{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Nova Categoria</h2>

        <a
            href="{{ url_for('admin.categorias') }}"
            class="btn btn-secondary">

            Voltar

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-4">

                    <label class="form-label">
                        Nome da Categoria
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        placeholder="Ex.: Velas Aromáticas"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        name="descricao"
                        rows="4"
                        class="form-control"
                        placeholder="Descreva brevemente esta categoria."></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Salvar Categoria

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
