{% extends "admin/layouts/_base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Editar Produto</h2>

        <a
            href="{{ url_for('admin.produtos') }}"
            class="btn btn-secondary">

            Voltar

        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        value="{{ produto.nome }}"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Categoria
                    </label>

                    <select
                        name="categoria"
                        class="form-select"
                        required>

                        <option value="" disabled>
                            Selecione uma categoria
                        </option>

                        {% for categoria in categorias %}

                            <option
                                value="{{ categoria.nome }}"
                                {% if produto.categoria == categoria.nome %}
                                    selected
                                {% endif %}>

                                {{ categoria.nome }}

                            </option>

                        {% endfor %}

                    </select>

                    <small class="text-muted">
                        As categorias disponíveis são gerenciadas no painel administrativo.
                    </small>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        name="descricao"
                        rows="4"
                        class="form-control">{{ produto.descricao }}</textarea>

                </div>


                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Preço
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="preco"
                            class="form-control"
                            value="{{ produto.preco }}"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Estoque
                        </label>

                        <input
                            type="number"
                            min="0"
                            name="estoque"
                            class="form-control"
                            value="{{ produto.estoque }}"
                            required>

                    </div>

                </div>


                <div class="mt-4">

                    <label class="form-label">
                        Imagem Atual
                    </label>

                    <br>

                    <img
                        src="{{ url_for('static', filename='img/products/' ~ produto.imagem) }}"
                        class="img-thumbnail mb-3"
                        style="max-width:180px;">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Alterar Imagem
                    </label>

                    <input
                        type="file"
                        name="imagem"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,.webp">

                    <small class="text-muted">
                        Deixe em branco para manter a imagem atual.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Salvar Alterações

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
