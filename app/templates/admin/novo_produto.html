{% extends "admin/layouts/_base.html" %}

{% block title %}Novo Produto{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Novo Produto</h2>

        <a
            href="{{ url_for('admin.produtos') }}"
            class="btn btn-secondary">

            Voltar

        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Categoria
                    </label>

                    <select
                        name="categoria"
                        class="form-select"
                        required>

                        <option value="" selected disabled>
                            Selecione uma categoria
                        </option>

                        {% for categoria in categorias %}

                            <option value="{{ categoria.nome }}">

                                {{ categoria.nome }}

                            </option>

                        {% endfor %}

                    </select>

                    <small class="text-muted">
                        As categorias disponíveis são gerenciadas no painel administrativo.
                    </small>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        name="descricao"
                        rows="4"
                        class="form-control"></textarea>

                </div>


                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Preço
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="preco"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Estoque
                        </label>

                        <input
                            type="number"
                            min="0"
                            name="estoque"
                            class="form-control"
                            value="0"
                            required>

                    </div>

                </div>


                <div class="mt-4">

                    <label class="form-label">
                        Foto do Produto
                    </label>

                    <input
                        type="file"
                        name="imagem"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,.webp">

                    <small class="text-muted">
                        Formatos aceitos: JPG, JPEG, PNG e WEBP.
                    </small>

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Salvar Produto

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
