<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Aromas & Encantos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #f8f5fa,
                #ffffff
            );
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-brand {
            color: #9382AB;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .login-subtitle {
            color: #777;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 0.9rem;
        }

        .form-control:focus {
            border-color: #9382AB;
            box-shadow: 0 0 0 0.2rem rgba(
                147,
                130,
                171,
                0.15
            );
        }

        .btn-login {
            background-color: #9382AB;
            border-color: #9382AB;
            border-radius: 10px;
            padding: 0.75rem;
        }

        .btn-login:hover {
            background-color: #7e6d96;
            border-color: #7e6d96;
        }

        .login-footer {
            font-size: 0.85rem;
            color: #999;
        }

    </style>

</head>


<body>

    <div class="container">

        <div
            class="row justify-content-center align-items-center login-container"
        >

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="card login-card">

                    <div class="card-body p-4 p-md-5">

                        <!-- Marca -->
                        <div class="text-center mb-4">

                            <h1 class="h3 login-brand">
                                Aromas & Encantos
                            </h1>

                            <p class="login-subtitle mb-0">
                                Área administrativa
                            </p>

                        </div>


                        <!-- Mensagem de erro -->
                        {% if erro %}

                            <div
                                class="alert alert-danger"
                                role="alert"
                            >
                                {{ erro }}
                            </div>

                        {% endif %}


                        <!-- Formulário -->
                        <form method="POST">

                            <div class="mb-3">

                                <label
                                    for="usuario"
                                    class="form-label"
                                >
                                    Usuário
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="usuario"
                                    name="usuario"
                                    placeholder="Digite seu usuário"
                                    autocomplete="username"
                                    required
                                    autofocus
                                >

                            </div>


                            <div class="mb-4">

                                <label
                                    for="senha"
                                    class="form-label"
                                >
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="senha"
                                    name="senha"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>


                            <button
                                type="submit"
                                class="btn btn-login text-white w-100"
                            >
                                Entrar
                            </button>

                        </form>


                        <div class="text-center mt-4">

                            <span class="login-footer">
                                Painel administrativo
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
